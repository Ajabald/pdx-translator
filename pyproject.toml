[project]
name = "ck3-translator"
version = "0.3.0"
description = "Оффлайн-переводчик локализаций модов Crusader Kings 3 и других игр Paradox"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["crusader-kings", "paradox", "localization", "translation", "modding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]
dependencies = ["PySide6>=6.6"]

[project.scripts]
ck3-translator = "ck3loc.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ck3loc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: тесты на реальных деревьях BLA (env CK3T_REALDATA)"]
