[project]
name = "pdx-translator"
version = "0.1.2"
# The description is in English, like the main README: GitHub shows only that
# one, and the package description has to read for the same person as the
# repository card. «Workbench» rather than «translator»: the tool differs from
# the batch converters holding the niche exactly by working row by row, and the
# word carries that.
description = "An offline workbench for translating Paradox mod localisation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# The games are listed by name because that is what people search by, not the
# word «Paradox»: each has its own mod scene and its own audience of translators.
# CK3 does not come first — there are eight of them and they are equals since
# 2026-08-11.
keywords = [
    "paradox-interactive", "localization", "translation", "modding",
    "translation-memory", "game-localization",
    "crusader-kings", "stellaris", "hearts-of-iron", "victoria-3",
    "europa-universalis", "imperator-rome",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]
dependencies = ["PySide6>=6.6"]

[project.scripts]
pdx-translator = "pdxloc.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.21", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdxloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: tests on the real BLA trees (env PDXT_REALDATA)"]

[tool.ruff]
# The code is set to about 100 columns, but 34 lines run past a hundred by one to
# ten characters, and every one of them is either the text of a message inside
# `translate(...)` or SQL: wrapping there tears a readable line apart for the sake
# of a counter. A limit of 110 keeps the rule working — a truly long line it will
# still catch.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E,F,W are what any linter catches; B the traps such as a mutable default; SIM
# simplifications; UP outdated idioms; RUF the rules of ruff itself. BLE and A
# were not picked at random: `# noqa` marks for them are already placed through
# the code, and without those rules the marks would be dead. The formatter stays
# off — the code is laid out by hand and on purpose.
#
# `N` (naming) is deliberately left out: Qt is overridden with camelCase methods
# (`rowCount`, `setData`) and with signals at class level — 69 hits on code that
# cannot look any other way.
select = ["E", "F", "W", "B", "SIM", "UP", "RUF", "BLE", "A"]

# Cyrillic «looks like Latin»: 2880 hits on comments and messages written in
# Russian. The rule is meant for English code, where a Cyrillic «с» gets in by
# mistake — here it is the other way round.
#
# RUF100 (a dead `# noqa` mark) is a story of its own. There are 173 such marks
# and almost all are harmless: 158 in the tests are `# noqa: E402` on an import
# after `os.environ.setdefault("QT_QPA_PLATFORM", …)`. The autofix removes **the
# whole comment line**, while ours carry an explanation after the rule code — «a
# re-export», «reads as prefs.set(…)», «we show the user any error». Losing those
# for the sake of a clean report will not do, and mending 173 places by hand is a
# diff with no use in it.
#
# RUF022/RUF023 demand an alphabetical `__all__` and `__slots__`: the autofix
# unfolds a compact list into a column for the sake of an order nobody reads.
# Grouping by meaning is more use than the alphabet.
#
# SIM118 («drop the .keys()») is harmful advice in this code, not a matter of
# taste. Rows from SQLite arrive as `sqlite3.Row`, and that searches by the `in`
# operator over **values**: for a row with the column game='ck3' the check
# `"game" in row` gives False, while `"ck3" in row` gives True. Obeying the hint
# in `project.py` would mean the game of a project always reads as CK3, quietly
# and without an error.
#
# The last three argue with a deliberate choice of the author rather than with
# carelessness: SIM103 wants `return not (a and b)` instead of an early return
# that carries an explaining comment; SIM105 a `contextlib.suppress` inside a
# loop; RUF012 counts class constant dictionaries (CHOICES, HINTS,
# _PANEL_BY_PROVIDER) as a trap, though they are only ever read.
ignore = [
    "RUF001", "RUF002", "RUF003", "RUF100", "RUF022", "RUF023", "SIM118",
    "SIM103", "SIM105", "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# The tests namespace their fixtures by module names and override autouse
# fixtures from conftest — to a linter that is a shadowed name.
"tests/*" = ["F811"]
# `def rowCount(self, parent=QModelIndex())` is the signature of a Qt model, not
# a trap with a mutable default: an empty index is immutable.
"src/pdxloc/gui/*" = ["B008"]
# `ru_translations.py` and `zh_translations.py` are tables of «original →
# translation» pairs, one line per pair. Wrapping them breaks reading by eye.
"tools/*" = ["E501"]
