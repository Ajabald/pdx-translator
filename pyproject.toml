[project]
name = "pdx-translator"
version = "0.1.0"
# Описание английское, как и главный README: GitHub показывает только его, и
# описание пакета обязано читаться тем же человеком, что и карточка репозитория.
# «Workbench», а не «переводчик»: инструмент отличается от батч-конвертеров,
# занявших нишу, именно построчной работой, и слово это несёт.
description = "An offline workbench for translating Paradox mod localisation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Игры перечислены поимённо, потому что искать будут по ним, а не по слову
# «Paradox»: у каждой своя сцена модов и своя аудитория переводчиков. CK3
# впереди не стоит — игр семь, и они равноправны с 2026-08-11.
keywords = [
    "paradox-interactive", "localization", "translation", "modding",
    "translation-memory", "game-localization",
    "crusader-kings", "stellaris", "hearts-of-iron", "victoria-3",
    "europa-universalis", "imperator-rome",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]
dependencies = ["PySide6>=6.6"]

[project.scripts]
pdx-translator = "pdxloc.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.21", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdxloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: тесты на реальных деревьях BLA (env PDXT_REALDATA)"]

[tool.ruff]
# Код свёрстан под ~100, но 34 строки переваливают за сотню на 1–10 символов, и
# все они — либо текст сообщения в `translate(...)`, либо SQL: перенос там рвёт
# читаемую строку ради счётчика. Планка в 110 оставляет правило рабочим — по-
# настоящему длинную строку оно поймает.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E,F,W — то, что ловит любой линтер; B — ловушки вроде изменяемого значения
# по умолчанию; SIM — упрощения; UP — устаревшие идиомы; RUF — правила самого
# ruff. BLE и A выбраны не наугад: под них в коде уже расставлены `# noqa`,
# и без этих правил метки были бы мёртвыми. Форматтер не включаем — код
# свёрстан вручную и осмысленно.
#
# `N` (именование) намеренно не берём: Qt переопределяется camelCase-методами
# (`rowCount`, `setData`) и сигналами в области класса — 69 срабатываний на
# коде, который иначе выглядеть не может.
select = ["E", "F", "W", "B", "SIM", "UP", "RUF", "BLE", "A"]

# Кириллица «похожа на латиницу»: 2880 срабатываний на комментариях и
# сообщениях, написанных по-русски. Правило рассчитано на англоязычный код,
# куда кириллическая «с» попадает по ошибке, — у нас наоборот.
#
# RUF100 (мёртвая метка `# noqa`) — отдельная история. Меток таких 173, и почти
# все безвредны: 158 в тестах — `# noqa: E402` при импорте после
# `os.environ.setdefault("QT_QPA_PLATFORM", …)`. Автофикс сносит **всю строку
# комментария**, а у нас после кода правила идёт объяснение — «реэкспорт»,
# «читается как prefs.set(…)», «показываем пользователю любую ошибку». Терять
# их ради чистоты отчёта нельзя, а править 173 места руками — diff без пользы.
#
# RUF022/RUF023 требуют алфавитного `__all__` и `__slots__`: автофикс
# разворачивает компактный список в столбик ради порядка, который никто не
# читает. Группировка по смыслу полезнее алфавита.
#
# SIM118 («убери .keys()») в этом коде — вредный совет, а не вкусовщина.
# Строки из SQLite приходят как `sqlite3.Row`, а он ищет оператором `in` по
# **значениям**: у строки с колонкой game='ck3' проверка `"game" in row` даёт
# False, зато `"ck3" in row` — True. Послушаться подсказки в `project.py`
# значило бы, что игра проекта всегда читается как CK3, тихо и без ошибки.
#
# Последние три спорят с осознанным выбором автора, а не с небрежностью:
# SIM103 хочет `return not (a and b)` вместо раннего возврата, у которого есть
# объясняющий комментарий; SIM105 — `contextlib.suppress` внутри цикла;
# RUF012 считает ловушкой словари-константы класса (CHOICES, HINTS,
# _PANEL_BY_PROVIDER), которые только читаются.
ignore = [
    "RUF001", "RUF002", "RUF003", "RUF100", "RUF022", "RUF023", "SIM118",
    "SIM103", "SIM105", "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Тесты namespace'ят фикстуры именами модулей и переопределяют autouse-фикстуры
# из conftest — для линтера это затенение имени.
"tests/*" = ["F811"]
# `def rowCount(self, parent=QModelIndex())` — подпись модели Qt, а не ловушка
# с изменяемым значением по умолчанию: пустой индекс неизменяем.
"src/pdxloc/gui/*" = ["B008"]
# `ru_translations.py` и `zh_translations.py` — таблицы пар «оригинал → перевод»
# по строке на пару. Переносить их значит ломать сопоставление глазами.
"tools/*" = ["E501"]
