name: tests

on:
  push:
    branches: [main]
    # Без фильтра тегов теговый пуш — не событие вовсе, и job `build` ниже,
    # как бы точно ни было написано его условие, не выполнится никогда.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# По умолчанию токену хватает чтения; право на запись выдаётся точечно тому
# job, который создаёт релиз.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Новый коммит в ветку отменяет прогон предыдущего, а вот сборку релиза по
  # тегу обрывать нельзя — она одна на тег.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя обещанная граница (`requires-python` в pyproject) и версия,
        # на которой ведётся разработка. Обещание «Python 3.11+» проверяется,
        # а не декларируется.
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen      # тесты GUI без реального экрана
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev
      - name: Lint
        # Линтер держит в узде то, что глазами не увидишь: неопределённое имя
        # в редко нажимаемом пункте меню так и жило, пока его не нашёл ruff.
        run: ruff check .
      - name: Build translations
        # `.qm` — производная от `.ts`, и тест сверяет их время правки. После
        # checkout метки произвольны, поэтому переводы собираются заново.
        run: python tools/i18n.py release
      - name: Run tests
        run: pytest -q -m "not realdata"

  build:
    # Портативная сборка прикладывается к релизу при пуше тега vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pytest
    runs-on: windows-latest
    permissions:
      contents: write     # без этого softprops/action-gh-release получает 403
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Собираем на нижней поддерживаемой: интерпретатор уезжает внутрь
          # портативной сборки, и брать более новый, чем обещано, незачем.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev
      - name: Build translations
        run: python tools/i18n.py release
      - name: Build
        run: pyinstaller pdx-translator.spec
      - name: Package
        run: Compress-Archive -Path dist/pdx-translator/* -DestinationPath pdx-translator-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: pdx-translator-*.zip
          name: PDX Translator ${{ github.ref_name }}
          # Описание релиза лежит в репозитории и правится вместе с кодом.
          # Иначе оно пишется в веб-форме второпях и нигде не хранится: к
          # следующему выпуску вспоминать, что изменилось, будет не по чему.
          body_path: RELEASE_NOTES.md
          # Релиз без архива хуже красного CI: люди увидят версию, которую
          # нечем скачать.
          fail_on_unmatched_files: true
