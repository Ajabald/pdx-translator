# Заготовка CI. Активируется, когда репозиторий появится на GitHub.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen      # тесты GUI без реального экрана
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-qt
      - name: Run tests
        run: pytest -q -m "not realdata"

  build:
    # Портативная сборка прикладывается к релизу при пуше тега vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pytest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          pyinstaller ck3-translator.spec
      - name: Package
        run: Compress-Archive -Path dist/ck3-translator/* -DestinationPath ck3-translator-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ck3-translator-*.zip
