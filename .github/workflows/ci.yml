name: tests

on:
  push:
    branches: [main]
    # Without a tag filter a tag push is not an event at all, and the `build` job
    # below will never run, however precisely its condition is written.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# By default the token needs read access; write is granted pointwise to the job
# that creates the release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new commit to a branch cancels the run of the previous one, but a release
  # build by tag must not be interrupted — there is one per tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound we promise (`requires-python` in pyproject) and the
        # version development happens on. The promise «Python 3.11+» is checked
        # rather than declared.
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen      # the GUI tests without a real screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev
      - name: Lint
        # The linter keeps in check what the eye does not catch: an undefined name
        # in a rarely pressed menu item lived on until ruff found it.
        run: ruff check .
      - name: Build translations
        # The `.qm` is a derivative of the `.ts`, and a test compares their edit
        # times. After a checkout the stamps are arbitrary, so the translations
        # are rebuilt.
        run: python tools/i18n.py release
      - name: Run tests
        run: pytest -q -m "not realdata"

  build:
    # The portable build is attached to the release on a push of a vX.Y.Z tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pytest
    runs-on: windows-latest
    permissions:
      contents: write     # without this softprops/action-gh-release gets a 403
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Built on the lowest supported one: the interpreter travels inside the
          # portable build, and taking a newer one than promised is pointless.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev
      - name: Build translations
        run: python tools/i18n.py release
      - name: Build
        run: pyinstaller pdx-translator.spec
      - name: Package
        run: Compress-Archive -Path dist/pdx-translator/* -DestinationPath pdx-translator-${{ github.ref_name }}.zip
      - name: Install Inno Setup
        # The runner image does not have it; choco is always there.
        run: choco install innosetup --no-progress -y
      - name: Installer
        # The version without the «v»: the tag is called v0.1.0, while Windows
        # wants numbers in the file properties. `VersionInfoVersion` would choke
        # on the «v».
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          # The path is not guessed: choco installs machine-wide, winget into the
          # user profile, and a hard-coded string breaks at the first divergence.
          # The braces in the variable name are obligatory as ${...}: otherwise
          # PowerShell cuts the name at ProgramFiles and parses «(x86)» apart.
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "ISCC: $iscc"
          & $iscc /DAppVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer build failed" }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pdx-translator-*.zip
            pdx-translator-setup-*.exe
          name: PDX Translator ${{ github.ref_name }}
          # The release description lives in the repository and is edited together
          # with the code. Otherwise it gets written in a web form in a hurry and
          # is kept nowhere: by the next release there is nothing to recall what
          # changed from.
          body_path: RELEASE_NOTES.md
          # A release without an archive is worse than a red CI: people see a
          # version there is nothing to download.
          fail_on_unmatched_files: true
