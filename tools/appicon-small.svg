<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Тот же знак для 16 и 32 пикселей. Столбцов нет вовсе, стрелка занимает
       почти всё поле: на такой сетке любая деталь мельче четверти высоты
       превращается в серую точку, и подробный рисунок читается хуже, чем
       грубый. Скругление меньше — на 16 пикселях большой радиус съедает угол
       целиком, и квадрат становится кругом. -->

  <rect width="256" height="256" rx="36" fill="#1e3a5f"/>

  <path d="M40 128 h116" stroke="#e0a83c" stroke-width="40"
        stroke-linecap="round" fill="none"/>
  <path d="M156 74 l52 54 -52 54" stroke="#e0a83c" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
