<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Иконка приложения, крупные размеры (48 и больше). Мелкие рисуются из
       `appicon-small.svg`: здесь слишком много деталей, и на 16 пикселях они
       сливаются в кашу.

       Рисуется путями, без текста: шрифт на чужой машине может отличаться или
       отсутствовать, и буква поедет.

       Смысл знака — то, чем инструмент отличается от пакетного конвертера: две
       колонки, оригинал и перевод, и строка, переходящая из левой в правую. -->

  <rect width="256" height="256" rx="52" fill="#1e3a5f"/>

  <!-- левая колонка: оригинал, холодный светлый -->
  <g fill="#dce6f2">
    <rect x="46" y="64" width="72" height="16" rx="8"/>
    <rect x="46" y="176" width="72" height="16" rx="8"/>
  </g>

  <!-- правая колонка: перевод, тёплый -->
  <g fill="#e0a83c">
    <rect x="138" y="64" width="72" height="16" rx="8"/>
    <rect x="138" y="176" width="56" height="16" rx="8"/>
  </g>

  <!-- строка переходит из левой колонки в правую; полоса идёт ровно по центру,
       и до столбцов сверху и снизу остаётся воздух — иначе на глаз слипается -->
  <path d="M46 128 h120" stroke="#e0a83c" stroke-width="20"
        stroke-linecap="round" fill="none"/>
  <path d="M166 100 l30 28 -30 28" stroke="#e0a83c" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
